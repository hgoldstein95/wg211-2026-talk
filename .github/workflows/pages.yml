# Build the deck in slides/ and publish slides/dist/ to GitHub Pages on every push to main.
#
# One-time setup: Settings → Pages → "Build and deployment" → Source:
# "GitHub Actions". The deck then lives at
# https://hgoldstein95.github.io/wg211-talk/ — a subpath, which is
# why src/main.js re-bases the deck's asset paths.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push supersedes one still queued.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # The deck is one directory of this repo, beside the notes and the Lean code.
    defaults:
      run:
        working-directory: slides
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: slides/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: slides/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
